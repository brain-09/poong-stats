<style>
@font-face {
  font-family: 'Pretendard Variable';
  font-weight: 45 920;
  font-style: normal;
  font-display: block;
  src: url('fonts/PretendardVariable.woff2') format('woff2-variations');
}

  html { scrollbar-gutter: stable; }
  * { box-sizing: border-box; }

  body {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont,
      system-ui, "Malgun Gothic", sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 20px 10px;
    color: #1a1d29;
  }
  .top-bar {
    max-width: 1080px;
    margin: 0 auto 16px;
    background: #fff;
    border-radius: 20px;
    padding: 16px 20px;
    min-height: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    box-shadow: 0 1px 2px rgba(20,20,30,0.04), 0 4px 12px rgba(20,20,30,0.05);
  }
  .month-select-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .top-date-select {
    font-size: 20px;
    font-weight: 800;
    color: #141821;
    letter-spacing: 0px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    padding: 2px 0;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
  }
  .top-date-select:hover { color: #4a5ce0; }
  .nav-chevron {
    font-size: 14px;
    color: #c2c5cc;
    margin: 0 4px;
    user-select: none;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 600;
    color: #8a8d97;
    text-decoration: none;
  }
  .back-link:hover { color: #4a5ce0; }
  .top-meta-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .top-meta-sep { color: #c2c5cc; }
  .top-meta {
    font-size: 10px;
    color: #a4a8b2;
    white-space: nowrap;
  }
  .source-link {
    color: #4a5ce0;
    font-weight: 600;
    text-decoration: none;
  }
  .source-link:hover { text-decoration: underline; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    align-items: start;
    gap: 16px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .grid.single-team {
    grid-template-columns: 1fr;
    max-width: 480px;
  }
  .team-card {
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,20,30,0.04), 0 8px 24px rgba(20,20,30,0.06);
  }
  .team-card-topbar { height: 6px; background: #4a5ce0; }
  .team-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #f2f3f5;
    gap: 8px;
    flex-wrap: wrap;
  }
  .team-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .team-link {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    color: inherit;
    text-decoration: none;
  }
  .team-link:hover .team-name { text-decoration: underline; }
  .team-logo {
    width: 28px;
    height: 28px;
    border-radius: 10px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .team-name {
    font-size: 16px;
    font-weight: 800;
    color: #141821;
    letter-spacing: 0px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .team-count {
    font-size: 10px;
    color: #a4a8b2;
    font-weight: 500;
    white-space: nowrap;
  }
  .rank-change {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .rank-change.up { color: #0f8a4c; background: #e6f8ee; }
  .rank-change.down { color: #c0392b; background: #fdeaea; }
  .rank-change.same { color: #888; background: #eceef1; }
  .rank-change.new { color: #4a5ce0; background: #e6e9fb; }

  .member-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .member-col:first-child { border-right: 1px solid #f2f3f5; }
  .member-col-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    color: #a4a8b2;
    letter-spacing: 0px;
    padding: 10px 16px 8px;
    background: #fafbfc;
  }
  .member-col-label .col-label-text { font-size: 12px; font-weight: 700; line-height: 1; }
  .member-col-label .unit-label { font-size: 12px; font-weight: 700; line-height: 1; text-align: right; }
  .member-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    border-left: 4px solid transparent;
    min-height: 28px;
  }
  .member-row.tier1 { border-left-color: #4a5ce0; background: #f4f6fe; }
  .member-row.tier5 { border-left-color: #1c9e6e; background: #effbf5; }
  .member-row.tier10 { border-left-color: #d9a71b; background: #fdf6e0; }
  .member-row.excluded { border-left-color: #d64545; background: #fdeaea; }
  .member-name {
    font-size: 12px;
    color: #3a3d47;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .member-name-link { display: flex; align-items: center; gap: 6px; min-width: 0; color: inherit; text-decoration: none; }
  .member-name-link:hover { text-decoration: underline; }
  .member-row.tier1 .member-name,
  .member-row.tier5 .member-name,
  .member-row.tier10 .member-name,
  .member-row.excluded .member-name { font-weight: 700; color: #1a1d29; }
  .bday-mark { font-size: 8px; opacity: 0.75; flex-shrink: 0; }
  .member-value {
    font-size: 12px;
    color: #6b6f79;
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    padding-left: 8px;
  }
  .member-row.tier1 .member-value { color: #4a5ce0; font-weight: 700; }
  .member-row.tier5 .member-value { color: #0f8a5c; font-weight: 700; }
  .member-row.tier10 .member-value { color: #8a6d1a; font-weight: 700; }
  .member-row.excluded .member-value { color: #1a1d29; font-weight: 700; }
  .member-row.empty .member-name, .member-row.empty .member-value { color: #ccc; }

  .team-footer {
    display: flex;
    gap: 6px;
    padding: 12px 10px 14px;
    background: #fafbfc;
    border-top: 1px solid #f2f3f5;
  }
  .stat-card {
    flex: 1;
    text-align: center;
    padding: 14px 8px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid #eef0f2;
    min-width: 0;
  }
  .stat-card-header { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 5px; margin-left: -6px; }
  .stat-label { font-size: 12px; color: #1a1d29; font-weight: 600; }
  .stat-value { font-size: 14px; font-weight: 800; color: #1a1d29; font-variant-numeric: tabular-nums; }
  .stat-icon { color: #1a1d29; flex-shrink: 0; }
  .stat-card.female-avg { background: #eaf7f5; border: none; }
  .stat-card.female-avg .stat-value { color: #085041; }
  .stat-card.total-avg { background: #f1eefb; border: none; }
  .stat-card.total-avg .stat-value { color: #26215c; }

  .profile-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    font-size: 12px;
    border-bottom: 1px solid #f2f3f5;
  }
  .profile-row-label { color: #6b6f79; font-weight: 600; }
  .profile-row-value { font-weight: 700; color: #1a1d29; }
  .profile-station-icon { width: 20px; height: 20px; border-radius: 5px; display: block; }

  .legend {
    max-width: 1080px;
    margin: 16px auto 0;
    font-size: 10px;
    color: #6b6f79;
    text-align: center;
  }
  .legend span { margin: 0 6px; }
  .legend .sw {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
  }

</style>
