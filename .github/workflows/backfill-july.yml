name: Backfill July 2026 (일회성)

on:
  workflow_dispatch: {}  # Actions 탭에서 수동으로만 실행

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backfill script
        run: python scripts/backfill_july.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive
          git diff --quiet --cached || git commit -m "7월 데이터 수동 백필"
          git push
