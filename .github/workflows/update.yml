name: Update poong stats

on:
  schedule:
    # UTC 기준 0,6,12,18시 = KST 오전 9시, 오후 3시, 오후 9시, 새벽 3시 (6시간마다)
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}  # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Generate HTML
        run: python scripts/generate_html.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/archive docs/index.html docs/archive
          git diff --quiet --cached || git commit -m "자동 업데이트: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
