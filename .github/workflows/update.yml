name: Update poong stats

on:
  schedule:
    # UTC 기준 0,4,8,12,16,20시 = KST 오전 9시, 오후 1시, 오후 5시, 오후 9시, 새벽 1시, 새벽 5시 (4시간마다)
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}  # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Generate HTML
        run: python scripts/generate_html.py

      - name: Remove old multi-file outputs (구조 변경 이전 잔재 정리)
        run: |
          rm -f docs/broadcast.html
          rm -rf docs/archive docs/archive-broadcast
          find docs/teams -maxdepth 1 -type f \( -name "*__*.html" -o -name "*-broadcast*.html" \) -delete 2>/dev/null || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "자동 업데이트: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
